<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma</title>
    <link rel="stylesheet" href="suma.css">
    <script src="suma.js"></script>
</head>

<body>
    <div id="titulo">
        <h1>Sumas</h1>
        <hr>
    </div>
    <div class="fondo">
        <div class="Calculadora">
            <div class="Respuestas">
                <div>
                    <input type="number" name="num1" id="num1" placeholder="Ingrese un numero">
                </div>

                <h2>+</h2>
                <div>
                    <input type="number" name="num2" id="num2" placeholder="Ingrese otro numero">
                </div>
                <h2>=</h2>
                <div>
                    <h2 id="resultado">Resultado</h2>
                </div>
            </div>
            <div class="Numeros">
                <div class="numeros">
                    <button id="1" onclick="agregarNumero1()">1</button>
                    <button id="2" onclick="agregarNumero2()">2</button>
                    <button id="3" onclick="agregarNumero3()">3</button>
                    <button id="4" onclick="agregarNumero4()">4</button>
                    <button id="5" onclick="agregarNumero5()">5</button>
                    <button id="6" onclick="agregarNumero6()">6</button>
                    <button id="7" onclick="agregarNumero7()">7</button>
                    <button id="8" onclick="agregarNumero8()">8</button>
                    <button id="9" onclick="agregarNumero9()">9</button>
                    <button id="borrar" onclick="borrar()">C</button>
                    <button id="0" onclick="agregarNumero0()">0</button>
                    <button id="igual" onclick="calcularResultado()">=</button>
                </div>
            </div>
        </div>
</body>

</html>
